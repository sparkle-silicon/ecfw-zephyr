# The west manifest file for the Zephyr EC FW.
#
# The per-installation west configuration file specifies the location of this
# manifest file. The "path" option in the [manifest] section of .west/config
# defines the folder that contains west.yml. The path is relative to the folder
# that contains .west.
#

west:
  url: https://github.com/zephyrproject-rtos/west
  version: v0.7.2

manifest:

  remotes:
    # 原名 zephyrproject（因沿用官方命名导致 VS Code 显示误导），现改为 fork 组织名
    - name: sparkle-silicon
      # 原官方源（私有化前）: https://github.com/zephyrproject-rtos
      url-base: git@github.com:sparkle-silicon

  # The list of dependencies
  #
  projects:
    # Open source branch uses official Zephyr tree
    - name: zephyr_public
      repo-path: zephyr.git
      path: west/zephyr_fork
      remote: sparkle-silicon
      # 原官方 v3.6.0；改用 spksilicon-ae103 分支（含 ae103 SoC 移植）
      revision: spksilicon-ae103
      clone-depth: 1
      west-commands: scripts/west-commands.yml

  self:
    # manifest 仓库（本库）实际位于顶层 ecfw-zephyr/，与 .west/config 的 [manifest] path 对齐
    path: ecfw-zephyr
