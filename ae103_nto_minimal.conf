# SPK AE103 最小验证配置（EXTRA_CONF_FILE 覆盖，临时、可逆）
#
# 历史：AE103 早期无 systimer（CONFIG_SYS_CLOCK_EXISTS=n），deferred logging 依赖
#   后台线程 + k_timer 无法链接，故曾在此覆盖 CONFIG_LOG=n 压制日志。
# 现状：日志已改用 immediate（同步）模式（见 configs/optional.conf），不依赖
#   k_timer，无需再压制；此文件退化为「显式声明 CONFIG_LOG=y」，与 prj.conf /
#   optional.conf 一致，实际无覆盖作用。systimer 落地后可移除。

CONFIG_LOG=y
