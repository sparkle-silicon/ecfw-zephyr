# SPK AE103 最小验证配置（EXTRA_CONF_FILE 覆盖，临时、可逆）
#
# 背景：AE103 尚无 zephyr system timer（soc/.../ae103/timer.c 只是普通外设
# 驱动模板，非 systimer），故 defconfig 设 CONFIG_SYS_CLOCK_EXISTS=n。
# 但 prj.conf 的 CONFIG_LOG=y 走 deferred logging，依赖 k_timer（需 sys_clock），
# 两者冲突导致链接失败。最小验证阶段无需 LOG，故在此覆盖为 n。
# 待 AE103 systimer 落地、恢复 CONFIG_SYS_CLOCK_EXISTS=y 后，此文件即可移除。

CONFIG_LOG=n
