# ============================================================
# ④ 编译选项（opt）—— 对齐原固件 common.mk 的 CFLAGS，独立开关
# ============================================================
# 定位：不是「功能分层」，而是「编译参数」。build.sh 固定引入本文件。
#       每个编译参数一个开关，注释一行即关，无需增删 token。
#
# 对照原固件 common.mk 第 307~313 行：
#   CFLAGS += -fsigned-char
#   CFLAGS += -msave-restore  -fno-unroll-loops  -Os   -flto=auto
#   CFLAGS += -g
#   （-ffunction-sections -fdata-sections -fno-common / -mcmodel=medlow /
#     -march/-mabi 已由 Zephyr 板级自动处理，此处无需重复）

# ---- 1. 优化等级（-O）----
# Zephyr 用 Kconfig choice 四档（Kconfig.zephyr:393 COMPILER_OPTIMIZATIONS）：
#   CONFIG_SPEED_OPTIMIZATIONS=y  → -O2（速度优先，Zephyr 原生最高档）
#   CONFIG_SIZE_OPTIMIZATIONS=y   → -Os（体积优先，原固件 common.mk 用的就是它）
#   CONFIG_DEBUG_OPTIMIZATIONS=y  → -Og（调试体验）
#   CONFIG_NO_OPTIMIZATIONS=y     → -O0（不优化，栈需调大）
CONFIG_SIZE_OPTIMIZATIONS=y

# choice 里没有的档（-O1 / -O3 / -Ofast），取消对应行注释即可：
# COMPILER_OPT 在优化 flag 之后注入（zephyr_fork/CMakeLists.txt:420），
# gcc 最后一个 -O 生效，会覆盖上面的 -O2。
#   CONFIG_COMPILER_OPT="-O1"      # 比 -O2 低：介于 -O0/-O2 之间，调试更稳、体积略小
#   CONFIG_COMPILER_OPT="-O3"      # 比 -O2 高：更激进的内联 + 循环展开
#   CONFIG_COMPILER_OPT="-Ofast"   # 比 -O3 更激进（含 -ffast-math，牺牲严格 IEEE 浮点）
# 注意：-O3/-Ofast 在 ICACHE + 32KB RAM 的 AE103 上可能代码膨胀、加大栈占用，
#       仅测试用，不合适就重新注释掉、回退 -O2。三者互斥，同一时刻只放开一行。

# ---- 2. 调试信息 -g（common.mk: -g）----
# 开 → elf 带 DWARF，配合 build.sh 的 objdump -S 可看源码级反汇编。
# 关 → 交付固件体积更小。
CONFIG_DEBUG_INFO=y

# ---- 3. 链接时优化 -flto（common.mk: -flto=auto）----
# ⚠️ AE103 当前无法开启：Zephyr 的 LTO 依赖
#   depends on (!(GEN_ISR_TABLES || GEN_IRQ_VECTOR_TABLE) || ISR_TABLES_LOCAL_DECLARATION)
#   AE103 用 CONFIG_GEN_ISR_TABLES=y（中断向量表运行时生成），LTO 会把表内
#   引用的 handler 符号内联/重命名导致链接失败，故被 Kconfig 硬性禁止。
#   原固件 common.mk 的 -flto=auto 能用，是裸 Makefile 无此 ISR 表机制。
#   待后续改静态向量表 / 开 ISR_TABLES_LOCAL_DECLARATION 后再试。
# CONFIG_LTO=y

# ---- 4. 独立编译开关（每个一行，注释即关）----
# 每个开关对应的编译 flag 与取舍，见 Kconfig "AE103 compiler options" 的 help。

# 4.1 char 按有符号处理（common.mk: -fsigned-char）
#     ⚠️ 改变全局 char 语义，影响内核/库/第三方代码，若与库冲突需关闭「待验证」
CONFIG_AE103_OPT_FSIGNED_CHAR=y

# 4.2 RISC-V 省体积（common.mk: -msave-restore）
#     尾调用共享 save/restore 函数，减代码体积，无副作用，建议常开
CONFIG_AE103_OPT_MSAVE_RESTORE=y

# 4.3 禁循环展开（common.mk: -fno-unroll-loops）
#     减体积取向，与当前 -O2（speed）相反，-O2 下收益有限；极致体积改回 -Os 更有效
CONFIG_AE103_OPT_FNO_UNROLL_LOOPS=y

# 4.4 额外警告 -Wextra（common.mk 注释关；默认关）
# CONFIG_AE103_OPT_WEXTRA is not set
