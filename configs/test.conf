# ============================================================
# ③ 测试代码（test）—— 内部测试专用，客户不交付，交付时排除
# ============================================================

# CONFIG_FPU N100没有,仅编译测试使用

# # GCOV 代码覆盖率统计
# # 注意：需在 RAM 维护覆盖率计数区，显著增加 RAM 占用与运行时开销；
# #       仅内部测试用，生产/交付固件禁止开启。
# # 依赖链：COVERAGE_GCOV 是 choice 选项，choice depends on COVERAGE，
# #         COVERAGE depends on HAS_COVERAGE_SUPPORT（隐藏 capability）。
# #         AE103 soc 未 select HAS_COVERAGE_SUPPORT，故需 FORCE_COVERAGE
# #         （select HAS_COVERAGE_SUPPORT）打通整条链，否则 GCOV 被静默忽略。
# CONFIG_FORCE_COVERAGE=y
# CONFIG_COVERAGE=y
# CONFIG_COVERAGE_GCOV=y

# # RAM 占用大头：①覆盖率计数区（基本块数×8B，自动落 .bss）②gcov_heap（dump 缓冲）。
# # AE103 片上数据 SRAM 仅 32KB（0x20000~0x27FFF），全量插桩 ≈29KB 计数区 + 16KB heap
# # = 45KB 直接溢出。test 组合配套两项（见 BUILD.md 7.11.4）：
# #   - 降 heap：16384→4096。coverage.c 按「单个 object 文件」为单位分配 dump 缓冲，
# #     4096 足够绝大多数 object；极端大文件会打印 "No Mem available" 跳过该文件。
# #   - 扩 RAM：build.sh 的 test 分支加载 test_ram64k.overlay，sram0 扩到 64KB（含 iRAM0）。
# CONFIG_COVERAGE_GCOV_HEAP_SIZE=4096

# # ---- 帧指针 fp（frame pointer）----
# # 作用：覆盖编译器默认，决定是否保留栈帧指针 s0/fp。
# #   CONFIG_OMIT_FRAME_POINTER=n → 保留帧指针，利于运行时栈回溯(backtrace)调试
# #   CONFIG_OMIT_FRAME_POINTER=y → 省略帧指针，省 prologue/epilogue 指令并释放 s0
# # 注意：RV32E 仅 16 个寄存器，省略帧指针的收益更明显；调试期保留更友好。
# #       需先开 OVERRIDE_FRAME_POINTER_DEFAULT，OMIT_FRAME_POINTER 才生效。
# CONFIG_OVERRIDE_FRAME_POINTER_DEFAULT=y
# CONFIG_OMIT_FRAME_POINTER=n