# ============================================================
# ① 正式代码（base）—— 底层必须配置，随固件交付，客户可见
# ============================================================

# SPI Flash 驱动重定位到 RAM（架构强依赖，必须开启）
# 背景：AE103 ICACHE 采用「现场调度 SPIF 命中」机制。SPI Flash 操作期间
#       若驱动代码仍在 Flash 中 XIP 执行，会产生指令取指死锁：
#         SPIF 操作在等 CPU 指令 → CPU 取指需读 ICACHE → ICACHE 等 SPIF 释放。
#       故 SPI Flash 驱动必须搬离 Flash、到 RAM 运行。
# 配套：CONFIG_AE103_SPI_FLASH（下方）+ ae103/CMakeLists.txt 的
#       zephyr_code_relocate(FILES spi_flash.c LOCATION RAM) 生成
#       data_copy_xip_relocation()/bss_zeroing_relocation() 符号，
#       供启动代码（kernel/xip.c / init.c）在启动时复制到 RAM。

# CONFIG_ARCH_HAS_RAMFUNC_SUPPORT=y#非手动开,arch 隐藏 capability，RISC-V 在 XIP 下自动select

CONFIG_CODE_DATA_RELOCATION=y

# AE103 外部 SPI NOR Flash 驱动（空函数模板，架构强依赖搬 RAM）
# 见 soc/riscv/spksilicon/ae103/spi_flash.c + ae103/CMakeLists.txt。
CONFIG_AE103_SPI_FLASH=y

# 多线程内核（Zephyr 默认 y，此处显式声明意图）。
# 注：AE103 当前 CONFIG_SYS_CLOCK_EXISTS=n（无 systimer），多线程的时间能力
# （k_sleep/k_timer/时间片轮转）缺失，仅协作式（cooperative）切换可用。此开关
# 与 SYS_CLOCK_EXISTS 独立，显式声明不改变现有行为；systimer 落地后自动补全。
CONFIG_MULTITHREADING=y