# ============================================================
# ② 可选功能（optional）—— 可扩展，按需开关，客户可选项
# ============================================================

CONFIG_LOG=y                        # LOG 总开关（开发阶段要串口日志）

# ---- LOG 子系统（immediate 同步模式 —— 无 systimer 下的妥协方案）----
# AE103 暂无 systimer（CONFIG_SYS_CLOCK_EXISTS=n，ae103_nto_defconfig），deferred
# logging 依赖后台处理线程 + k_timer 无法链接；故改用 immediate（同步）模式：
# LOG 在调用上下文内直接输出，不经后台线程/MPSC 缓冲，不依赖 systimer。
# 代价是打日志阻塞当前上下文（EC 串口调试场景可接受）。逐项决策见 BUILD.md 7.14。

# ① 模式（choice LOG_MODE：选 immediate）
CONFIG_LOG_MODE_IMMEDIATE=y         # 同步输出，不依赖 k_timer
CONFIG_LOG_MODE_DEFERRED=n          # 显式关：依赖 k_timer+MPSC+后台线程，无 systimer 不可用
#   LOG_MODE_MINIMAL 自动为 n：极简 printk（无时间戳/前缀），immediate 已够用

# ② 输出后端 + printk 并入
CONFIG_LOG_BACKEND_UART=y           # LOG 走 UART0 console（复用 printk 的 uart0）
CONFIG_LOG_PRINTK=y                 # printk 也并入 LOG，统一从 UART 出

# ③ 级别 / 过滤（编译期静态过滤；EC 无需运行时改级别）
# ⚠️ 行内注释陷阱（本文件唯一硬约束，改动前必读）：
#   Zephyr 的 .conf 由 kconfiglib 解析，对 bool/tristate 只取 '=' 右侧「第一个字符」，
#   故 `CONFIG_LOG=y  # 注释` 安全；但 int/hex/string 会把右侧「整串」当值，
#   `CONFIG_LOG_MAX_LEVEL=4  # 注释` 的值会变成 "4  # 注释" → 解析失败 → Kconfig warning。
#   而 Zephyr 的 scripts/kconfig/kconfig.py:118 把「任何」warning 升级为致命错误
#   （白名单仅放过 "set more than once"），故 int/hex/string 的注释必须独立成行。
# 编译进系统的最高级别：4=DEBUG（交付可降 3=INFO 省 ROM）
CONFIG_LOG_MAX_LEVEL=4
# 未显式指定级别的模块默认：3=INFO
CONFIG_LOG_DEFAULT_LEVEL=3
# 0=不强制抬高模块级别（临时调试某模块时才改）
CONFIG_LOG_OVERRIDE_LEVEL=0
# 关运行时改级别（省 ROM/RAM，编译期过滤够用）
CONFIG_LOG_RUNTIME_FILTERING=n

# ④ 时间戳 / 前端 / 缓冲（显式声明为关）
CONFIG_LOG_TIMESTAMP_64BIT=n        # 32 位毫秒时间戳≈49 天够用，64 位费 RAM
CONFIG_LOG_FRONTEND=n               # 无自定义前端，走标准 backend
#   LOG_FRONTEND_ONLY 随 LOG_FRONTEND=n 符号不存在，无需声明
CONFIG_MPSC_PBUF=n                  # 仅 deferred 模式 select；immediate 不需要

# ⑤ 内核 tick（LOG 时间戳最终引用 sys_clock；当前无 systimer 不生效）
# 默认 100；systimer 落地后 EC 建议 1000/tickless
CONFIG_SYS_CLOCK_TICKS_PER_SEC=100

# 栈区域初始化为已知值 0xaa，便于检测栈高水位（栈溢出排查）
CONFIG_INIT_STACKS=y

# AE103 早期看门狗初始化（z_prep_c 之前喂狗/禁狗，防启动阶段看门狗超时复位）
# 对应 soc/riscv/spksilicon/ae103/Kconfig.soc 的 CONFIG_WDOG_INIT。
CONFIG_WDOG_INIT=y

# 线程
# 注：线程本地存储(TLS) 已统一至下方「③ RISC-V 特殊寄存器」3.1 节，默认关闭、按需开启。
#     另：CONFIG_PICOLIBC 需先在 west manifest(ecfw-zephyr/west.yml) 配置 picolibc 模块才能
#     生效，当前未配置，Kconfig 实际回退到 minimal libc。

# CPU 核数（提前配置的明确目标；AE103 单核 N100，恒为 1）
# ⚠️ 不推荐改动——仅多核衍生品明确支持时由芯片侧调整。
CONFIG_MP_MAX_NUM_CPUS=1

# # ----  线程本地存储 TLS（tp 寄存器）----
# # 作用：__thread 变量、errno、当前线程指针走「每线程私有副本」，
# #       上下文切换由 arch/riscv/core/switch.S 恢复 tp。
# # 成本：每线程栈顶额外预留 z_tls_data_size() 字节（仅 errno+current 约 8B）。
# # 前置：cross-compile 工具链必须显式声明支持 TLS，否则下面的开关不生效
# #       （TOOLCHAIN_SUPPORTS_THREAD_LOCAL_STORAGE 依赖此声明，见 kernel/Kconfig）。
# CONFIG_TOOLCHAIN_CROSS_COMPILE_SUPPORTS_THREAD_LOCAL_STORAGE=y
# CONFIG_THREAD_LOCAL_STORAGE=y
# CONFIG_CURRENT_THREAD_USE_TLS=y     # 当前线程指针放 TLS，省一次 CPU 结构体间接寻址（默认 y）
# CONFIG_ERRNO_IN_TLS=y              # errno 放 TLS，多线程下线程安全（默认 y）
