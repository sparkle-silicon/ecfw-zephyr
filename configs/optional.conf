# ============================================================
# ② 可选功能（optional）—— 可扩展，按需开关，客户可选项
# ============================================================

# CONFIG_LOG=n

# 栈区域初始化为已知值 0xaa，便于检测栈高水位（栈溢出排查）
CONFIG_INIT_STACKS=y

# AE103 早期看门狗初始化（z_prep_c 之前喂狗/禁狗，防启动阶段看门狗超时复位）
# 对应 soc/riscv/spksilicon/ae103/Kconfig.soc 的 CONFIG_WDOG_INIT。
CONFIG_WDOG_INIT=y

# CPU 核数（提前配置的明确目标；AE103 单核 N100，恒为 1）
# ⚠️ 不推荐改动——仅多核衍生品明确支持时由芯片侧调整。
CONFIG_MP_MAX_NUM_CPUS=1
